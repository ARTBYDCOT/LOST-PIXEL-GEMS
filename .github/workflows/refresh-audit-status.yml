name: Refresh audit status

on:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run refresh script
        run: |
          python .github/scripts/refresh_audit.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "copilot-bot"
            git config user.email "copilot-bot@example.com"
            git add documentation/lost-pixel-gems-docs/contracts.json .github/audit-status.json || true
            git commit -m "chore(docs): refresh contract verification status (best-effort)\n\nAutomated run from refresh-audit-status workflow" || echo "no changes to commit"
            git push
          else
            echo "No changes"
          fi
